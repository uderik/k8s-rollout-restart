version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Use only an explicit set of important linters.
  default: none
  enable:
    # golangci-lint "standard" set
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional useful ones
    - misspell
    - revive

  settings:
    govet:
      # Shadow checking is too noisy for this codebase.
      disable:
        - shadow

    revive:
      rules:
        # Disable overly strict rules
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    generated: lax
    rules:
      # Tests may ignore errors from helpers/fakes and use relaxed style.
      - path: _test\.go
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
